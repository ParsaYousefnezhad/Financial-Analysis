<!-- Indicator Settings Modal -->
<div class="modal fade" id="indicatorSettingsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="indicatorModalTitle">Settings</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="indicatorModalBody"></div>
            <div class="modal-footer p-2">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-sm btn-primary" id="saveIndicatorSettingsBtn">Apply</button>
            </div>
        </div>
    </div>
</div>

<script id="app-data" type="application/json">
{{ {
    "initAsset":     selected_asset,
    "initTimeframe": selected_timeframe,
    "assets":        assets
} | tojson }}
</script>
<script>
    (function () {
        const el = document.getElementById('app-data');
        const data = JSON.parse(el.textContent);
        window.APP_CONFIG = {
            initAsset:     data.initAsset,
            initTimeframe: data.initTimeframe
        };
        window.APP_ASSETS = data.assets;
    })();
</script>
